<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Skyline Dash — demo</title>
<style>
  :root {
    --bg: #0b0c10;
    --ground: #1c1f26;
    --accent: #ff5c8a;
    --text: #f2f3f5;
    --text-dim: #9aa0a6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 12px;
    pointer-events: none;
  }
  #hint {
    position: absolute;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    pointer-events: none;
  }
  #flash {
    position: absolute;
    inset: 0;
    background: rgba(255, 92, 92, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><span id="score">0.0s</span><span>Skyline Dash — demo</span></div>
    <div id="hint">Tap / Space to jump</div>
    <div id="flash"></div>
  </div>
  <script>
    // Standalone playable demo: no external assets, no network calls.
    // Posts a message to the parent app on every jump — the parent's
    // PlayablePreviewScreen listens for this to count interactions.
    function notifyInteraction() {
      try {
        window.parent.postMessage({ type: 'swipeplayable:interaction', game: 'endless-runner' }, '*')
      } catch (e) {}
    }

    var canvas = document.getElementById('c')
    var ctx = canvas.getContext('2d')
    var scoreEl = document.getElementById('score')
    var flashEl = document.getElementById('flash')

    var W = 0, H = 0, groundY = 0
    function resize() {
      var stage = document.getElementById('stage')
      W = canvas.width = stage.clientWidth
      H = canvas.height = stage.clientHeight
      groundY = H * 0.72
    }
    resize()
    window.addEventListener('resize', resize)

    var GRAVITY = 2200
    var JUMP_VELOCITY = -820
    var SPEED = 260

    var player = { x: 0, y: 0, size: 34, vy: 0, grounded: true }
    var obstacles = []
    var elapsed = 0
    var lastSpawn = 0
    var last = performance.now()

    function resetRun() {
      player.x = W * 0.18
      player.y = groundY - player.size
      player.vy = 0
      player.grounded = true
      obstacles = []
      elapsed = 0
      lastSpawn = 0
    }
    resetRun()

    function jump() {
      if (player.grounded) {
        player.vy = JUMP_VELOCITY
        player.grounded = false
        notifyInteraction()
      }
    }

    function spawnObstacle() {
      var size = 26 + Math.random() * 20
      obstacles.push({ x: W + size, y: groundY - size, size: size })
    }

    function collide(a, b) {
      return a.x < b.x + b.size && a.x + a.size > b.x && a.y < b.y + b.size && a.y + a.size > b.y
    }

    function flashHit() {
      flashEl.style.opacity = '1'
      setTimeout(function () {
        flashEl.style.opacity = '0'
      }, 150)
    }

    function step(now) {
      var dt = Math.min(0.05, (now - last) / 1000)
      last = now
      elapsed += dt
      lastSpawn += dt

      if (lastSpawn > 1.1 - Math.min(0.5, elapsed * 0.02)) {
        lastSpawn = 0
        spawnObstacle()
      }

      player.vy += GRAVITY * dt
      player.y += player.vy * dt
      if (player.y >= groundY - player.size) {
        player.y = groundY - player.size
        player.vy = 0
        player.grounded = true
      }

      for (var i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= SPEED * dt
        if (obstacles[i].x + obstacles[i].size < 0) obstacles.splice(i, 1)
        else if (collide(player, obstacles[i])) {
          flashHit()
          resetRun()
        }
      }

      draw()
      scoreEl.textContent = elapsed.toFixed(1) + 's'
      requestAnimationFrame(step)
    }

    function draw() {
      ctx.clearRect(0, 0, W, H)

      var sky = ctx.createLinearGradient(0, 0, 0, H)
      sky.addColorStop(0, '#14161c')
      sky.addColorStop(1, '#0b0c10')
      ctx.fillStyle = sky
      ctx.fillRect(0, 0, W, H)

      ctx.fillStyle = '#1c1f26'
      ctx.fillRect(0, groundY, W, H - groundY)
      ctx.strokeStyle = '#262932'
      ctx.beginPath()
      ctx.moveTo(0, groundY)
      ctx.lineTo(W, groundY)
      ctx.stroke()

      ctx.fillStyle = '#ff5c8a'
      roundRect(player.x, player.y, player.size, player.size, 8)
      ctx.fill()

      ctx.fillStyle = '#6c7bff'
      for (var i = 0; i < obstacles.length; i++) {
        var o = obstacles[i]
        roundRect(o.x, o.y, o.size, o.size, 6)
        ctx.fill()
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath()
      ctx.moveTo(x + r, y)
      ctx.arcTo(x + w, y, x + w, y + h, r)
      ctx.arcTo(x + w, y + h, x, y + h, r)
      ctx.arcTo(x, y + h, x, y, r)
      ctx.arcTo(x, y, x + w, y, r)
      ctx.closePath()
    }

    window.addEventListener('pointerdown', jump)
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space') jump()
    })

    requestAnimationFrame(step)
  </script>
</body>
</html>
