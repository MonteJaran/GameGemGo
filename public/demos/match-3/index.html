<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Gem Cascade — demo</title>
<style>
  :root {
    --bg: #0b0c10;
    --text-dim: #9aa0a6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #hud {
    padding: 10px 12px 0;
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 12px;
  }
  #board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 10px;
  }
  canvas {
    touch-action: none;
  }
  #hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding-bottom: 12px;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="hud"><span id="matches">0 matched</span><span>Gem Cascade — demo</span></div>
    <div id="board-wrap"><canvas id="c"></canvas></div>
    <div id="hint">Tap a gem, then tap a neighbor to swap</div>
  </div>
  <script>
    // Standalone playable demo: no external assets. Posts a message to the
    // parent app on every tap so PlayablePreviewScreen can count interactions.
    function notifyInteraction() {
      try {
        window.parent.postMessage({ type: 'swipeplayable:interaction', game: 'match-3' }, '*')
      } catch (e) {}
    }

    var N = 5
    var COLORS = ['#ff5c8a', '#5cc8ff', '#5cff9d', '#ffb84d', '#b98cff']
    var grid = []
    var selected = null
    var matchedCount = 0
    var busy = false

    var canvas = document.getElementById('c')
    var ctx = canvas.getContext('2d')
    var matchesEl = document.getElementById('matches')

    function randColor() {
      return Math.floor(Math.random() * COLORS.length)
    }

    function makeGrid() {
      var g = []
      for (var r = 0; r < N; r++) {
        var row = []
        for (var c = 0; c < N; c++) row.push(randColor())
        g.push(row)
      }
      return g
    }
    grid = makeGrid()

    var boardPx = 0,
      tile = 0
    function resize() {
      var wrap = document.getElementById('board-wrap')
      boardPx = Math.min(wrap.clientWidth, wrap.clientHeight) - 4
      tile = Math.floor(boardPx / N)
      boardPx = tile * N
      canvas.width = boardPx
      canvas.height = boardPx
      canvas.style.width = boardPx + 'px'
      canvas.style.height = boardPx + 'px'
      draw()
    }
    window.addEventListener('resize', resize)

    function roundRect(x, y, w, h, r) {
      ctx.beginPath()
      ctx.moveTo(x + r, y)
      ctx.arcTo(x + w, y, x + w, y + h, r)
      ctx.arcTo(x + w, y + h, x, y + h, r)
      ctx.arcTo(x, y + h, x, y, r)
      ctx.arcTo(x, y, x + w, y, r)
      ctx.closePath()
    }

    function draw() {
      ctx.clearRect(0, 0, boardPx, boardPx)
      var pad = Math.max(3, tile * 0.08)
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var v = grid[r][c]
          if (v === null) continue
          var x = c * tile + pad
          var y = r * tile + pad
          var s = tile - pad * 2
          ctx.fillStyle = COLORS[v]
          roundRect(x, y, s, s, s * 0.28)
          ctx.fill()
          if (selected && selected.r === r && selected.c === c) {
            ctx.lineWidth = Math.max(2, tile * 0.06)
            ctx.strokeStyle = '#ffffff'
            roundRect(x, y, s, s, s * 0.28)
            ctx.stroke()
          }
        }
      }
    }

    function findMatches(g) {
      var toClear = []
      for (var r = 0; r < N; r++) {
        var run = 1
        for (var c = 1; c <= N; c++) {
          if (c < N && g[r][c] !== null && g[r][c] === g[r][c - 1]) {
            run++
          } else {
            if (run >= 3) for (var k = 0; k < run; k++) toClear.push({ r: r, c: c - 1 - k })
            run = 1
          }
        }
      }
      for (var c2 = 0; c2 < N; c2++) {
        var run2 = 1
        for (var r2 = 1; r2 <= N; r2++) {
          if (r2 < N && g[r2][c2] !== null && g[r2][c2] === g[r2 - 1][c2]) {
            run2++
          } else {
            if (run2 >= 3) for (var k2 = 0; k2 < run2; k2++) toClear.push({ r: r2 - 1 - k2, c: c2 })
            run2 = 1
          }
        }
      }
      return toClear
    }

    function settle() {
      var matches = findMatches(grid)
      if (matches.length === 0) return false
      matchedCount += matches.length
      matchesEl.textContent = matchedCount + ' matched'
      for (var i = 0; i < matches.length; i++) grid[matches[i].r][matches[i].c] = null
      for (var c = 0; c < N; c++) {
        var col = []
        for (var r = 0; r < N; r++) if (grid[r][c] !== null) col.push(grid[r][c])
        while (col.length < N) col.unshift(randColor())
        for (var r2 = 0; r2 < N; r2++) grid[r2][c] = col[r2]
      }
      return true
    }

    function cascade() {
      if (settle()) {
        draw()
        setTimeout(cascade, 180)
      } else {
        busy = false
        draw()
      }
    }

    function swap(a, b) {
      var tmp = grid[a.r][a.c]
      grid[a.r][a.c] = grid[b.r][b.c]
      grid[b.r][b.c] = tmp
    }

    function isAdjacent(a, b) {
      return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1
    }

    canvas.addEventListener('pointerdown', function (e) {
      if (busy) return
      var rect = canvas.getBoundingClientRect()
      var x = e.clientX - rect.left
      var y = e.clientY - rect.top
      var c = Math.max(0, Math.min(N - 1, Math.floor(x / tile)))
      var r = Math.max(0, Math.min(N - 1, Math.floor(y / tile)))
      var tapped = { r: r, c: c }
      notifyInteraction()

      if (!selected) {
        selected = tapped
        draw()
        return
      }
      if (selected.r === tapped.r && selected.c === tapped.c) {
        selected = null
        draw()
        return
      }
      if (!isAdjacent(selected, tapped)) {
        selected = tapped
        draw()
        return
      }

      var a = selected
      var b = tapped
      selected = null
      swap(a, b)
      var hasMatch = findMatches(grid).length > 0
      if (!hasMatch) {
        draw()
        setTimeout(function () {
          swap(a, b) // no match — swap back
          draw()
        }, 140)
        return
      }
      busy = true
      draw()
      setTimeout(cascade, 120)
    })

    resize()
  </script>
</body>
</html>
